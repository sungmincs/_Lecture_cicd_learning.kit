# 10.9 GitLab CI: 테스트 -> 이미지 빌드 -> 매니페스트 갱신. 배포는 EKS의 Argo CD가 한다.
# 구조 변경 전 ch6.9(로컬 클러스터)에서 검증한 파이프라인과 같다. 클러스터가 EKS로 바뀌어도 CI 쪽은 바뀌지 않는다.
# Argo CD가 Git을 당겨 가는 구조라 이 파이프라인에는 AWS 자격 증명이 필요 없다.
#
# GitLab CI/CD Variables: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN(masked), GITLAB_TOKEN(masked, write_repository)

workflow:
  rules:
    # 매니페스트 갱신 커밋이 파이프라인을 다시 돌리지 않도록 이 규칙을 맨 앞에 둔다
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_REPOSITORY: <dockerhub_username>/worklog-backend
  DOCKER_CONFIG: "/tmp/docker_config"
  DOCKER_HOST: tcp://docker:2375

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  script:
    - uv sync --extra dev
    - TESTING=true uv run coverage run --source ./src/worklog -m pytest --disable-warnings -v
    - uv run coverage report

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  needs: [test]
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-8)
    - docker buildx rm mybuilder 2>/dev/null || true
    - docker buildx create --name mybuilder --driver docker-container --use
    - docker buildx build --platform linux/amd64,linux/arm64
        -t $DOCKER_REPOSITORY:$SHORT_SHA
        --push .

deploy:
  stage: deploy
  image: alpine:latest
  needs: [build]
  before_script:
    - apk add --no-cache git
  script:
    - SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-8)
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@myk8s.local"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - 'sed -i "s|image: .*worklog-backend:.*|image: $DOCKER_REPOSITORY:$SHORT_SHA|" deploy_manifest/worklog-backend.yaml'
    - 'sed -i "s|value: .* # IMAGE_TAG|value: \"$SHORT_SHA\" # IMAGE_TAG|" deploy_manifest/worklog-backend.yaml'
    - git add deploy_manifest/
    - 'git diff --staged --quiet || git commit -m "deploy: update image tag to $SHORT_SHA [skip ci]"'
    # 충돌 시 이 커밋을 채택한다. '|| true'로 넘기면 push가 아무것도 안 올리고 초록불로 끝난다(ch8 참조)
    - git pull --rebase -X theirs origin main
    - git push origin HEAD:main
