stages:
  - lint
  - security
  - build
  - deploy

variables:
  DOCKER_REPOSITORY: <dockerhub_username>/worklog-backend
  DOCKER_CONFIG: "/tmp/docker_config"
  DOCKER_HOST: tcp://docker:2375

.determine-environment: &determine-environment
  - |
    if [[ "$CI_COMMIT_TAG" =~ ^v ]]; then
      export TARGET_ENV=prod
      export ARGOCD_APP=worklog-backend-prod
    elif [[ "$CI_COMMIT_BRANCH" =~ ^release/ ]]; then
      export TARGET_ENV=staging
      export ARGOCD_APP=worklog-backend-staging
    else
      export TARGET_ENV=dev
      export ARGOCD_APP=worklog-backend-dev
    fi

workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: $CI_COMMIT_TAG =~ /^v/

lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  script:
    - uv sync --extra dev
    - uv run ruff check src/

security-scan:
  stage: security
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  variables:
    GITLEAKS_VERSION: "8.30.1"
  before_script:
    # gitleaks detect는 커밋 이력을 스캔하므로 git이 필요하다 (uv 이미지엔 없음)
    - apt-get update -qq && apt-get install -y -qq curl git
    # gitleaks: 러너 아키텍처에 맞는 바이너리를 받는다
    - |
      case "$(uname -m)" in
        x86_64)        GL_ARCH=x64 ;;
        aarch64|arm64) GL_ARCH=arm64 ;;
        *)             GL_ARCH=x64 ;;
      esac
      curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz" \
        | tar -xz -C /usr/local/bin/ gitleaks
  script:
    - uv sync --extra dev
    - uv run pip-audit
    - gitleaks detect --source . --config .gitleaks.toml --no-banner

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    SHORT_SHA: $CI_COMMIT_SHORT_SHA
  script:
    - *determine-environment
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - docker buildx rm mybuilder 2>/dev/null || true
    - docker buildx create --name mybuilder --driver docker-container --use
    - |
      docker buildx build --platform linux/amd64,linux/arm64 \
        -t $DOCKER_REPOSITORY:$SHORT_SHA \
        --push .

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git sed
  script:
    - *determine-environment
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        BRANCH="main"
      else
        BRANCH="$CI_COMMIT_BRANCH"
      fi
    - SHORT_SHA=$CI_COMMIT_SHORT_SHA
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@myk8s.local"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git rebase --abort 2>/dev/null || true
    - 'sed -i "s|image: .*worklog-backend:.*|image: $DOCKER_REPOSITORY:$SHORT_SHA|" deploy_manifest/worklog-backend.yaml'
    - git add deploy_manifest/
    - 'git diff --staged --quiet || git commit -m "deploy: update image tag to $SHORT_SHA for $TARGET_ENV [skip ci]"'
    - git pull --rebase origin $BRANCH || true
    - git push origin HEAD:$BRANCH
