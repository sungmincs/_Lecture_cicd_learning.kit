# ch9.6 GitHub Actions — scan job (build 다음, deploy가 needs로 의존)
jobs:
  scan:
    runs-on: ubuntu-latest
    needs: [determine-environment, build]
    steps:
      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REPOSITORY }}:${{ needs.determine-environment.outputs.image_tag }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'           # 취약점 발견 시 파이프라인 실패(게이트)
          ignore-unfixed: true     # fix 없는 CVE(zlib1g 등)는 제외 → fix 가능한 것만 차단

  deploy:
    needs: [determine-environment, build, scan]   # scan 통과해야 배포
    # ... (이하 ch8 deploy job과 동일)
