# ch9.4 GitHub Actions — security-scan job (lint 다음, build가 needs로 의존)
jobs:
  security-scan:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks 전체 이력 스캔에 필요
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - name: pip-audit (dependency vulnerabilities)
        run: |
          uv sync --extra dev
          uv run pip-audit
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # build가 security-scan 통과를 요구하도록 needs에 추가
  build:
    needs: [determine-environment, init-and-test, security-scan]
    # ... (이하 ch8 build job과 동일)
